site_name: mcp-lint
site_description: Lint and grade Model Context Protocol (MCP) servers.
site_url: https://superintelligenceco.github.io/mcp-lint/
repo_url: https://github.com/superintelligenceco/mcp-lint
repo_name: superintelligenceco/mcp-lint
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
  palette:
    - scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Architecture: architecture.md
  - FAQ: faq.md
  - Decisions:
      - adr/index.md
      - adr/0001-lint-the-model-facing-surface.md
      - adr/0002-average-entity-scores-and-cap-on-injection.md
      - adr/0003-permissive-list-requests.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

exclude_docs: |
  requirements.txt
  demo.tape
