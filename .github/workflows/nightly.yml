name: Nightly

# Catches breakage that does not come from a commit: new releases of the MCP SDK and other
# dependencies within their semver ranges, the next Node.js release, and a real third-party server.

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-deps:
    name: Latest dependencies (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      # npm 10, bundled with Node 22, crashes in its peer-set resolution on this tree
      # ("Cannot read properties of null (reading 'edgesOut')") when there is no lockfile.
      - name: Install the newest versions allowed by package.json
        run: |
          rm package-lock.json
          npx -y npm@11 install --no-audit --no-fund
          npm ls @modelcontextprotocol/sdk ajv zod
      - run: npm run typecheck
      - run: npm run build
      - name: Test with extra property-based runs
        run: npm test
        env:
          FC_NUM_RUNS: "1000"

  real-server:
    name: Lint a real third-party server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Lint @modelcontextprotocol/server-everything over stdio
        run: |
          node dist/cli.js --min-score 0 --json everything.json -- npx -y @modelcontextprotocol/server-everything
          node -e 'const r = require("./everything.json"); if (!(r.inventory.tools > 0)) process.exit(1); console.log(r.score, r.grade)'
