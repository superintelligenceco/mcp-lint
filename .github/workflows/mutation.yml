name: Mutation testing

# Runs Stryker against the rules, the scoring model, and the argv parser. The run fails when the
# mutation score drops below the "break" threshold in stryker.config.json.

on:
  schedule:
    - cron: "13 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    name: Stryker
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run mutation
      - name: Summary
        if: ${{ always() }}
        run: node scripts/mutation-score.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
