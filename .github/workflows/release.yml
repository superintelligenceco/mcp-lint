name: Release

# Builds the downloadable artifacts: standalone executables for five platforms, the npm package
# tarball, SPDX SBOMs, SHA256SUMS, and the multi-arch container image.
# - workflow_dispatch: builds everything and keeps the files as workflow run artifacts only.
# - push of a v* tag: also creates the GitHub Release from CHANGELOG.md, attaches the files with
#   build provenance attestations, pushes the signed image to GHCR, and publishes the package to
#   npm as @superintelligenceco/mcp-lint with npm provenance.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: 1.4.2

jobs:
  binary:
    name: Binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: mcp-lint-linux-x64
          - os: ubuntu-24.04-arm
            asset: mcp-lint-linux-arm64
          - os: macos-latest
            asset: mcp-lint-darwin-arm64
          - os: macos-15-intel
            asset: mcp-lint-darwin-x64
          - os: windows-latest
            asset: mcp-lint-windows-x64.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: npm ci
      - name: Compile
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: node scripts/compile.mjs "out/$ASSET"
      - name: Smoke-test the executable
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          bin="out/$ASSET"
          "$bin" --version
          "$bin" --no-color --json clean.json -- node test/fixtures/server.mjs clean
          grep -q '"grade": "A"' clean.json
          "$bin" --no-color --file examples/messy-server.json --min-score 0 --json messy.json
          grep -q '"grade": "F"' messy.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: out/${{ matrix.asset }}
          if-no-files-found: error

  npm-package:
    name: npm package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Pack
        run: |
          mkdir out
          tarball=$(npm pack --pack-destination out --silent)
          mv "out/$tarball" out/mcp-lint.tgz
      - name: Check that the tag matches package.json
        if: ${{ github.ref_type == 'tag' }}
        env:
          TAG: ${{ github.ref_name }}
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - name: Smoke-test a global install of the tarball
        run: |
          npm install --global --prefix "$RUNNER_TEMP/global" ./out/mcp-lint.tgz
          "$RUNNER_TEMP/global/bin/mcp-lint" --version
          "$RUNNER_TEMP/global/bin/mcp-lint" --no-color -- node test/fixtures/server.mjs clean
      - name: SBOM for the npm package
        run: npm sbom --omit dev --sbom-format spdx > out/mcp-lint.spdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-lint.tgz
          path: |
            out/mcp-lint.tgz
            out/mcp-lint.spdx.json
          if-no-files-found: error

  image:
    name: Container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.ref_type == 'tag' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: ${{ env.PUSH == 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ env.PUSH == 'true' }}
      - name: Sign the image with cosign (keyless)
        if: ${{ env.PUSH == 'true' }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
      - name: Attest build provenance for the image
        if: ${{ env.PUSH == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: SBOM for the image
        if: ${{ env.PUSH == 'true' }}
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: mcp-lint-image.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ env.PUSH == 'true' }}
        with:
          name: mcp-lint-image.spdx.json
          path: mcp-lint-image.spdx.json
          if-no-files-found: error

  publish:
    name: Checksums and release assets
    needs: [binary, npm-package, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            CHANGELOG.md
            scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: assets
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: assets
        run: |
          chmod +x mcp-lint-linux-* mcp-lint-darwin-*
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance for the release assets
        if: ${{ github.ref_type == 'tag' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: assets/SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-lint-release
          path: assets/
          if-no-files-found: error
      - name: Attach assets to the GitHub Release
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            node scripts/release-notes.mjs "$TAG" > notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md
          fi
          cd assets
          gh release upload "$TAG" --clobber ./*

  verify-install:
    name: Install from the release (${{ matrix.os }})
    needs: publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run install.sh for this tag
        env:
          MCP_LINT_VERSION: ${{ github.ref_name }}
          MCP_LINT_INSTALL_DIR: ${{ runner.temp }}/bin
        run: sh install.sh
      - name: Lint the messy example with the installed executable
        env:
          BIN: ${{ runner.temp }}/bin/mcp-lint
          TAG: ${{ github.ref_name }}
        run: |
          test "v$("$BIN" --version)" = "$TAG"
          "$BIN" --no-color --file examples/messy-server.json --min-score 0 --json report.json
          grep -q '"grade": "F"' report.json

  npm-publish:
    name: Publish to npm
    needs: publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@superintelligenceco/mcp-lint
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          test "v$version" = "$TAG"
          if npm view "$name@$version" version > /dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            npm publish --access public --provenance
          fi
