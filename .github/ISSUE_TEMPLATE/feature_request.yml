name: Feature or rule request
description: Suggest a new rule, output format, or CLI option.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem in an MCP server should mcp-lint catch, or what can't you do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior you want. For a new rule, include a tool definition that should trigger it and one that should not.
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - schema
        - description
        - injection
        - capability
        - naming
        - output or reporting
        - CLI or GitHub Action
        - other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
