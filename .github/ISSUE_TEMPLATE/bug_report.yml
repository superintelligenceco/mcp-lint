name: Bug report
description: Report something mcp-lint does wrong, such as a crash, a false positive, or a missed finding.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. To report a security vulnerability, don't open an issue. Follow [SECURITY.md](https://github.com/superintelligenceco/mcp-lint/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the exact command you ran. A minimal `tools/list` JSON that triggers the problem helps most.
      placeholder: |
        mcp-lint --file tools.json
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Paste the output. Remove tokens and other secrets first.
      render: text
  - type: input
    id: version
    attributes:
      label: mcp-lint version
      description: Output of `mcp-lint --version`.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version and OS
      placeholder: Node 22.12, Ubuntu 24.04
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Target
      options:
        - "--file (saved tools/list)"
        - stdio command
        - Streamable HTTP
        - HTTP+SSE
        - GitHub Action
